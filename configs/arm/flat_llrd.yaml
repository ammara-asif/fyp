# flat_llrd.yaml — THE CONTROL. One group per block, geometric decay matched to (1,4,16)
# over the three slabs: output slab x1, middle slab x1/4, input slab x1/16.
name: flat_llrd
rule: per_level_lr
nesting:
  depth: 6
  periods: [1, 1, 1, 1, 1, 1]
  lr_ratios: [1.0, 0.5, 0.25, 0.125, 0.0625, 0.03125]   # fastest first; slow_deep puts 0.03125 on stem
  ordering: slow_deep
rule_kwargs: {}