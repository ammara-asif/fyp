# nested_b.yaml — per-level LR at the same 3 slabs.
# NOTE: this is mathematically identical to flat_llrd. Kept as a named arm only
# to confirm the two configs agree; drop one once verified.
name: nested_b
rule: per_level_lr
lr: 0.5
nesting: {depth: 3, periods: [1, 4, 16], lr_ratios: [1.0, 0.25, 0.0625], ordering: slow_deep}
rule_kwargs: {}
